name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython==0.29.33"

      - name: Build APK
        shell: bash {0}
        run: |
          set +o pipefail
          # First pass initializes python-for-android and its build directory.
          yes | buildozer -v android debug || true

          # The target Python site-packages on PYTHONPATH contains a pip build
          # incompatible with host Python 3.14. Keep PYTHONPATH out of pip's
          # own upgrade/install commands inside python-for-android.
          P4A_BUILD=".buildozer/android/platform/python-for-android/pythonforandroid/build.py"
          if [ ! -f "$P4A_BUILD" ]; then
            echo "python-for-android build.py was not created; cannot apply pip compatibility fix."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path(".buildozer/android/platform/python-for-android/pythonforandroid/build.py")
          source = path.read_text()
          replacements = {
              "source venv/bin/activate && pip install -U pip":
                  "source venv/bin/activate && env -u PYTHONPATH pip install pip==25.3",
              "venv/bin/pip install Cython":
                  "env -u PYTHONPATH venv/bin/pip install Cython",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected python-for-android command was not found: {old}")
              source = source.replace(old, new)
          path.write_text(source)
          print("Applied python-for-android pip/PYTHONPATH compatibility fix")
          PY

          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-assistant-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
