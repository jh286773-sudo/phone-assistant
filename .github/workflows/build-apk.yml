name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython==0.29.33"

      - name: Build APK
        shell: bash {0}
        run: |
          set +o pipefail
          # First pass initializes python-for-android and its build directory.
          yes | buildozer -v android debug || true

          # python-for-android's automatic latest-pip upgrade currently breaks
          # its build venv on Python 3.14. Pin the venv pip to a compatible release.
          P4A_BUILD=".buildozer/android/platform/python-for-android/pythonforandroid/build.py"
          if [ ! -f "$P4A_BUILD" ]; then
            echo "python-for-android build.py was not created; cannot apply pip compatibility fix."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path(".buildozer/android/platform/python-for-android/pythonforandroid/build.py")
          source = path.read_text()
          old = "source venv/bin/activate && pip install -U pip"
          new = "source venv/bin/activate && pip install pip==25.3"
          if old not in source:
              raise SystemExit("Expected python-for-android pip upgrade command was not found")
          path.write_text(source.replace(old, new))
          print("Pinned python-for-android build venv pip to 25.3")
          PY

          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-assistant-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
