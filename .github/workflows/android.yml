name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "android_src/**/*.java"
      - "android_res/**/*.xml"
      - "android_manifest_application.xml"
      - "services/**/*.py"
      - "security_audit.py"
      - ".github/workflows/android.yml"

concurrency:
  group: phone-assistant-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Build debug APK
        shell: bash
        run: |
          set +o pipefail
          # Remove stale APKs so verification cannot pass on an old build.
          rm -f bin/*.apk
          # python-for-android upgrades pip inside its temporary build venv.
          # Keep pip below 26: pip 26 currently breaks this p4a install path.
          printf 'pip<26\n' > "$RUNNER_TEMP/pip-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/pip-constraints.txt"
          yes | buildozer -v android debug
          build_status=${PIPESTATUS[1]}
          exit "$build_status"

      - name: Verify APK output
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
