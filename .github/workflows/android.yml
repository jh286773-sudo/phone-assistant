name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "buildozer.spec"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6             cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize Android SDK through Buildozer
        shell: bash
        run: |
          set +o pipefail
          yes | buildozer -v android debug || true

      - name: Accept Android SDK licenses and install build tools
        shell: bash
        run: |
          SDK_ROOT="$GITHUB_WORKSPACE/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find "$GITHUB_WORKSPACE/.buildozer/android/platform" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;37.0.0"
          test -x "$SDK_ROOT/build-tools/37.0.0/aidl"

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
